name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same PR are wasted minutes — cancel them. Non-PR
# runs (push to main, dispatch) get a unique group per run so no verdict is
# ever cancelled: with a shared group, GitHub keeps at most one running plus
# one pending run, so a third rapid merge would silently drop a pending main
# verdict even with cancel-in-progress off (codex review, #210).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token, matching release.yml's discipline. The test job
# executes code from fork PRs (cargo test, installer e2e); nothing in this
# workflow needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Suspected trigger for the corrupt test-harness class (floo-cli#204) is
  # incremental-compilation state; CI gains nothing from incremental (the
  # target/ cache would otherwise preserve a corrupt artifact forever).
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Known-vulnerable crates fail the PR. Accepted advisories (with an expiry)
      # live in osv-scanner.toml next to Cargo.lock. The binary is pinned by
      # version and checksum.
      - name: Audit dependencies (osv-scanner)
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan --lockfile Cargo.lock

      - name: Check script syntax
        run: bash -n install.sh && bash -n scripts/test && bash -n .githooks/pre-push && bash -n scripts/install-hooks.sh

      - name: Run installer script tests
        run: bash tests/install_script_test.sh

      - name: Run installer script e2e
        run: bash tests/install_script_e2e.sh

      - name: Run npx launcher tests
        run: node --test
        working-directory: npm/getfloo

      - name: Run test-harness guard tests
        run: bash tests/test_script_test.sh

      - name: Run pre-push hook tests
        run: bash tests/pre_push_hook_test.sh

      # fmt + clippy + cargo test via the canonical entry point, which also
      # self-heals the corrupt-harness artifact class (floo-cli#204) that the
      # target/ cache would otherwise pin across runs.
      - name: Run fmt, clippy, and tests
        run: ./scripts/test

  # Informational, not a merge gate: tarpaulin (compiled from source each run)
  # is too slow for the PR lane, so it tracks coverage on merges only. Keeping
  # it out of pr-check's `needs` is deliberate — see the speed targets in the
  # monorepo's docs/knowledge/domains/testing.md.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --out stdout --skip-clean

  # Aggregated status for branch protection — the ONE required context, same
  # name and role as the monorepo's pr-check.yml summary job, so
  # scripts/ops/configure-branch-protection.sh (in getfloo/floo) protects both
  # repos with the same required-check list. To add a merge gate, add the job
  # to `needs:` and its result to the assertion — the context name never
  # changes. `coverage` is intentionally absent (informational lane, above).
  pr-check:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: report
        run: |
          echo "test: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
